[project]
name = "insighta-cli"
version = "1.0.0"
description = "Insighta Labs+ CLI tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "requests",
    "python-dotenv"
]

[project.scripts]
insighta = "insighta_cli.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"